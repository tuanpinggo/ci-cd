apiVersion: apps/v1
kind: Deployment
metadata:
  name: hl-fresh
  labels:
    app.kubernetes.io/name: hl-fresh
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hl-fresh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hl-fresh
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: hl-fresh
          image: hl-fresh
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
      terminationGracePeriodSeconds: 30
