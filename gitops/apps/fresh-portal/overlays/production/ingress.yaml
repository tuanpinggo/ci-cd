apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fresh-portal
  labels:
    app.kubernetes.io/name: fresh-portal
    app.kubernetes.io/component: backend
    app.kubernetes.io/environment: production
spec:
  ingressClassName: traefik
  rules:
    - host: api-fresh.honglam.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fresh-portal
                port:
                  name: http
