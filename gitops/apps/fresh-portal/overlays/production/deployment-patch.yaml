apiVersion: apps/v1
kind: Deployment
metadata:
  name: fresh-portal
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/environment: production
    spec:
      containers:
        - name: fresh-portal
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
