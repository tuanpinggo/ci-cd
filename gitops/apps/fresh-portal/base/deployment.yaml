apiVersion: apps/v1
kind: Deployment
metadata:
  name: fresh-portal
  labels:
    app.kubernetes.io/name: fresh-portal
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fresh-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fresh-portal
        app.kubernetes.io/component: backend
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: fresh-portal
          image: fresh-portal
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fresh-portal-config
            - secretRef:
                name: fresh-portal-secret
                optional: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 30
